<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Super Benji TCG Card Database</title>

        <link rel="stylesheet" href="style.css">

    </head>

    <body>

        <h1>Benji Island - Super Benji TCG Card Database</h1>
        
        <div class="description">
            <p>
                This website is a full card database for the Super Benji Trading Card Game. You can search for cards, view card details, 
                and explore the card sets.
            </p>

            <p><small>Search Help: <a href="searchhelp.html">Click Here</a></small></p>
        
        </div>

        <div id="searchArea">

        <input
        id="search"
        placeholder='Examples: benji set:bs26 hero (set:bs26 OR set:bs27) rarity:uncommon -text:fire'>

        <button id="go">
        Search
        </button>

        </div>

        <div id="results"></div>

        <script src="search.js"></script>

    </body>
</html>
